# ==============================================================================
# AstraRealism - block.properties
#
# Maps Minecraft blocks onto integer ids that arrive in the vertex shader as
# mc_Entity.x, where lib/material/material_id.glsl turns them into the
# MATID_* constants the rest of the pack branches on.
#
# The id numbers here MUST stay in sync with the ASTRA_BLOCK_* constants in
# lib/material/material_id.glsl. tools/validate_shader.py checks that.
#
# Blocks not listed fall through to id 0 and are treated as generic terrain,
# which is the correct default for stone, wood, dirt and the like.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1 - Foliage
#
# Wind-animated and strongly subsurface scattering. Kept separate from grass
# because leaf blocks are cubes while plants are cross-shaped.
# ------------------------------------------------------------------------------
block.1 = oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves \
          dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves \
          flowering_azalea_leaves pale_oak_leaves \
          vine glow_lichen hanging_roots mangrove_roots \
          spore_blossom big_dripleaf small_dripleaf \
          moss_block moss_carpet pale_moss_block pale_moss_carpet

# ------------------------------------------------------------------------------
# 2 - Small plants
#
# Same material response as foliage but with stronger wind displacement, since
# they are anchored at a single point.
# ------------------------------------------------------------------------------
block.2 = grass short_grass tall_grass fern large_fern dead_bush seagrass \
          tall_seagrass kelp kelp_plant \
          dandelion poppy blue_orchid allium azure_bluet \
          red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy \
          cornflower lily_of_the_valley wither_rose torchflower \
          pitcher_plant pink_petals sunflower lilac rose_bush peony \
          wheat carrots potatoes beetroots nether_wart \
          sweet_berry_bush cave_vines cave_vines_plant \
          bamboo bamboo_sapling sugar_cane \
          oak_sapling spruce_sapling birch_sapling jungle_sapling \
          acacia_sapling dark_oak_sapling cherry_sapling mangrove_propagule \
          brown_mushroom red_mushroom crimson_roots warped_roots nether_sprouts \
          crimson_fungus warped_fungus twisting_vines weeping_vines

# ------------------------------------------------------------------------------
# 3 - Water
# ------------------------------------------------------------------------------
block.3 = water flowing_water bubble_column

# ------------------------------------------------------------------------------
# 4 - Glass and translucent
# ------------------------------------------------------------------------------
block.4 = glass glass_pane tinted_glass \
          white_stained_glass orange_stained_glass magenta_stained_glass \
          light_blue_stained_glass yellow_stained_glass lime_stained_glass \
          pink_stained_glass gray_stained_glass light_gray_stained_glass \
          cyan_stained_glass purple_stained_glass blue_stained_glass \
          brown_stained_glass green_stained_glass red_stained_glass \
          black_stained_glass \
          white_stained_glass_pane orange_stained_glass_pane \
          magenta_stained_glass_pane light_blue_stained_glass_pane \
          yellow_stained_glass_pane lime_stained_glass_pane \
          pink_stained_glass_pane gray_stained_glass_pane \
          light_gray_stained_glass_pane cyan_stained_glass_pane \
          purple_stained_glass_pane blue_stained_glass_pane \
          brown_stained_glass_pane green_stained_glass_pane \
          red_stained_glass_pane black_stained_glass_pane

# ------------------------------------------------------------------------------
# 5 - Emissive blocks
#
# These both emit light and receive bloom. Their emission strength is refined
# per-block in material_id.glsl where it differs meaningfully.
# ------------------------------------------------------------------------------
block.5 = glowstone sea_lantern shroomlight \
          ochre_froglight verdant_froglight pearlescent_froglight \
          jack_o_lantern redstone_lamp \
          torch wall_torch soul_torch soul_wall_torch \
          lantern soul_lantern \
          campfire soul_campfire \
          candle white_candle orange_candle magenta_candle light_blue_candle \
          yellow_candle lime_candle pink_candle gray_candle \
          light_gray_candle cyan_candle purple_candle blue_candle \
          brown_candle green_candle red_candle black_candle \
          end_rod fire soul_fire \
          crying_obsidian respawn_anchor \
          magma_block \
          amethyst_cluster large_amethyst_bud medium_amethyst_bud \
          small_amethyst_bud \
          beacon conduit end_gateway end_portal \
          redstone_torch redstone_wall_torch \
          sculk_catalyst sculk_shrieker sculk_sensor calibrated_sculk_sensor \
          brewing_stand enchanting_table \
          copper_bulb exposed_copper_bulb weathered_copper_bulb \
          oxidized_copper_bulb \
          waxed_copper_bulb waxed_exposed_copper_bulb \
          waxed_weathered_copper_bulb waxed_oxidized_copper_bulb

# ------------------------------------------------------------------------------
# 6 - Lava
# ------------------------------------------------------------------------------
block.6 = lava flowing_lava

# ------------------------------------------------------------------------------
# 7 - Snow
#
# High albedo, strong forward scattering and a soft specular sheen.
# ------------------------------------------------------------------------------
block.7 = snow snow_block powder_snow

# ------------------------------------------------------------------------------
# 8 - Sand and loose granular material
# ------------------------------------------------------------------------------
block.8 = sand red_sand gravel suspicious_sand suspicious_gravel \
          sandstone red_sandstone smooth_sandstone smooth_red_sandstone \
          cut_sandstone cut_red_sandstone chiseled_sandstone \
          chiseled_red_sandstone soul_sand soul_soil

# ------------------------------------------------------------------------------
# 9 - Metal
#
# Only used when no LabPBR resource pack supplies real metalness. With one, the
# specular map wins and this classification is ignored.
# ------------------------------------------------------------------------------
block.9 = iron_block gold_block copper_block netherite_block \
          exposed_copper weathered_copper oxidized_copper \
          waxed_copper_block waxed_exposed_copper waxed_weathered_copper \
          waxed_oxidized_copper \
          cut_copper exposed_cut_copper weathered_cut_copper \
          oxidized_cut_copper \
          iron_bars iron_door iron_trapdoor heavy_weighted_pressure_plate \
          light_weighted_pressure_plate \
          anvil chipped_anvil damaged_anvil \
          hopper cauldron water_cauldron lava_cauldron powder_snow_cauldron \
          chain rail powered_rail detector_rail activator_rail \
          raw_iron_block raw_gold_block raw_copper_block \
          lightning_rod

# ------------------------------------------------------------------------------
# 10 - Ice
#
# Translucent, smooth and strongly subsurface scattering.
# ------------------------------------------------------------------------------
block.10 = ice packed_ice blue_ice frosted_ice

# ------------------------------------------------------------------------------
# 11 - Wet / porous stone
#
# Materials that visibly darken and gloss up in rain. Separated so the wetness
# model can use a stronger porosity than the default.
# ------------------------------------------------------------------------------
block.11 = stone cobblestone mossy_cobblestone andesite diorite granite \
           deepslate cobbled_deepslate tuff calcite dripstone_block \
           pointed_dripstone clay terracotta \
           gravel_path dirt_path coarse_dirt rooted_dirt mud packed_mud \
           bricks stone_bricks mossy_stone_bricks cracked_stone_bricks \
           blackstone basalt smooth_basalt polished_basalt
