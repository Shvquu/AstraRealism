# ==============================================================================
# AstraRealism - dimension.properties
#
# Maps Minecraft dimensions onto the shaders/world*/ folders.
#
# world0 uses the wildcard so that modded dimensions get the overworld
# treatment rather than falling through to the root folder. The nether and end
# entries list both the modern namespaced ids and the legacy short forms,
# because some mods and older worlds still report the latter.
#
# Note: when a dimension folder exists, Iris loads programs ONLY from that
# folder - there is no per-file fallback to shaders/. That is why every
# dimension folder holds a complete set of stubs, generated and verified by
# tools/gen_dimension_stubs.py.
# ==============================================================================

dimension.world-1 = minecraft:the_nether minecraft:nether
dimension.world1 = minecraft:the_end minecraft:end
dimension.world0 = *
