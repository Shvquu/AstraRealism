# ==============================================================================
# AstraRealism - shaders.properties
#
# Option names here must match the #define / const names in
# shaders/lib/common/settings.glsl exactly, and every option must have a label
# in shaders/lang/en_us.lang. tools/validate_shader.py enforces both.
# ==============================================================================
# AstraRealism version 0.1.0

# ------------------------------------------------------------------------------
# Iris feature flags
#
# All optional, never required. A missing capability makes the affected system
# fall back to a cheaper path (see lib/compat/fallback.glsl) rather than
# refusing to load the pack.
# ------------------------------------------------------------------------------
iris.features.optional = COMPUTE_SHADERS SSBO CUSTOM_IMAGES SEPARATE_HARDWARE_SAMPLERS PER_BUFFER_BLENDING ENTITY_TRANSLUCENT

# ------------------------------------------------------------------------------
# Vanilla rendering features we replace
# ------------------------------------------------------------------------------

# Vanilla clouds are replaced by the volumetric cloud system.
clouds = off

# We draw our own vignette in the final pass with a configurable falloff.
vignette = false

# The vanilla underwater screen overlay fights with our own underwater fog.
underwaterOverlay = false

# The vanilla sun and moon quads are not drawn at all. Both discs are generated
# procedurally in lib/atmosphere/sky.glsl, which is what lets the sun redden and
# dim through its own atmosphere as it sets, and the moon show a correctly
# oriented crescent. Leaving these on would only rasterise geometry that
# gbuffers_skytextured immediately discards.
sun = false
moon = false

# Particles draw after the deferred pass, so they are forward shaded.
# Set explicitly: the default depends on whether a deferred pass exists, and
# lib/lighting/forward.glsl relies on knowing which side of deferred they land.
particles.ordering = after

# Everything that can cast should cast. The shadow pass is cheap relative to
# the lighting it enables.
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true

# ------------------------------------------------------------------------------
# Blending
#
# These two programs draw before the deferred pass, so they write material
# properties into the gbuffer rather than colour into the scene. Alpha blending
# a gbuffer is meaningless - it would interpolate between two surfaces' packed
# normals and material IDs and produce a third surface that exists nowhere.
#
# The visible cost is that beacon beams render opaque rather than translucent.
# A dedicated translucent gbuffer in a later phase is the real fix.
# ------------------------------------------------------------------------------
blend.gbuffers_basic = off
blend.gbuffers_beaconbeam = off

# ------------------------------------------------------------------------------
# Alpha testing
#
# Translucent geometry is not cutout geometry: water at 70% alpha and stained
# glass must survive, so the automatic test is disabled and the shader decides.
# Cutout terrain still discards against alphaTestRef in the fragment stage.
# ------------------------------------------------------------------------------
alphaTest.gbuffers_water = off
alphaTest.gbuffers_hand_water = off

# ------------------------------------------------------------------------------
# Settings screen layout
# ------------------------------------------------------------------------------

screen.columns = 2

screen = <profile> <empty> \
         [LIGHTING] [SHADOWS] \
         [GI_AO] [REFLECTIONS] \
         [MATERIALS] [WATER] \
         [ATMOSPHERE] [CLOUDS] \
         [POST] [DEBUG]

screen.LIGHTING.columns = 1
screen.LIGHTING = SUN_INTENSITY MOON_INTENSITY SKYLIGHT_INTENSITY AMBIENT_INTENSITY \
                  <empty> \
                  BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMPERATURE BLOCKLIGHT_FALLOFF \
                  <empty> \
                  EMISSIVE_INTENSITY MINIMUM_LIGHT

screen.SHADOWS.columns = 2
screen.SHADOWS = SHADOWS_ENABLED <empty> \
                 shadowMapResolution shadowDistance \
                 shadowDistortionFactor SHADOW_BIAS \
                 <empty> <empty> \
                 SHADOW_FILTER SHADOW_SAMPLES \
                 SHADOW_BLOCKER_SAMPLES SUN_ANGULAR_RADIUS \
                 <empty> <empty> \
                 COLORED_SHADOWS <empty> \
                 CONTACT_SHADOWS <empty> \
                 CONTACT_SHADOW_STEPS CONTACT_SHADOW_LENGTH

screen.GI_AO.columns = 2
screen.GI_AO = GI_ENABLED <empty> \
               GI_STRENGTH GI_RADIUS \
               GI_SAMPLES GI_STEPS \
               GI_RESOLUTION_DIVISOR GI_TEMPORAL_FRAMES \
               GI_DENOISER GI_DENOISER_PASSES \
               <empty> <empty> \
               AO_MODE AO_STRENGTH \
               AO_SAMPLES AO_RADIUS

screen.REFLECTIONS.columns = 2
screen.REFLECTIONS = SSR_ENABLED <empty> \
                     SSR_STEPS SSR_REFINE_STEPS \
                     SSR_THICKNESS SSR_ROUGHNESS_CUTOFF \
                     <empty> <empty> \
                     SSR_ROUGH_REFLECTIONS SSR_ROUGH_SAMPLES \
                     SSR_TEMPORAL <empty>

screen.MATERIALS.columns = 2
screen.MATERIALS = PBR_MODE NORMAL_MAP_STRENGTH \
                   <empty> <empty> \
                   POM_ENABLED POM_SHADOW \
                   POM_DEPTH POM_STEPS \
                   POM_DISTANCE <empty> \
                   <empty> <empty> \
                   SUBSURFACE_SCATTERING SSS_STRENGTH \
                   SNOW_MATERIAL <empty> \
                   <empty> <empty> \
                   WETNESS_ENABLED WETNESS_STRENGTH \
                   PUDDLES PUDDLE_SIZE \
                   RAIN_RIPPLES <empty>

screen.WATER.columns = 2
screen.WATER = WATER_WAVES <empty> \
               WATER_WAVE_HEIGHT WATER_WAVE_SPEED \
               WATER_WAVE_OCTAVES <empty> \
               <empty> <empty> \
               WATER_REFRACTION WATER_REFRACTION_STRENGTH \
               WATER_ABSORPTION_DISTANCE WATER_SCATTERING \
               <empty> <empty> \
               WATER_CAUSTICS WATER_CAUSTICS_STRENGTH \
               WATER_CAUSTICS_SAMPLES <empty> \
               WATER_FOAM WATER_FOAM_DISTANCE

screen.ATMOSPHERE.columns = 2
screen.ATMOSPHERE = ATMOSPHERE_STEPS ATMOSPHERE_MULTISCATTER \
                    STARS_ENABLED STARS_INTENSITY \
                    <empty> <empty> \
                    FOG_ENABLED FOG_DENSITY \
                    HEIGHT_FOG HEIGHT_FOG_DENSITY \
                    HEIGHT_FOG_FALLOFF <empty> \
                    CAVE_FOG CAVE_FOG_DENSITY \
                    <empty> <empty> \
                    VOLUMETRIC_LIGHT VL_STRENGTH \
                    VL_STEPS VL_RESOLUTION_DIVISOR \
                    VL_ANISOTROPY <empty>

screen.CLOUDS.columns = 2
screen.CLOUDS = CLOUDS_MODE CLOUD_SHADOWS \
                <empty> <empty> \
                CLOUD_DENSITY CLOUD_COVERAGE \
                CLOUD_SPEED <empty> \
                CLOUD_ALTITUDE CLOUD_THICKNESS \
                <empty> <empty> \
                CLOUD_STEPS CLOUD_LIGHT_STEPS \
                CLOUD_RESOLUTION_DIVISOR <empty>

screen.POST.columns = 2
screen.POST = [ANTIALIASING] [BLOOM] \
              [EXPOSURE] [COLOR] \
              [DOF_MOTION] [LENS]

screen.ANTIALIASING.columns = 1
screen.ANTIALIASING = AA_MODE <empty> TAA_STRENGTH TAA_SHARPEN

screen.BLOOM.columns = 1
screen.BLOOM = BLOOM_ENABLED <empty> BLOOM_STRENGTH BLOOM_RADIUS BLOOM_MIPS

screen.EXPOSURE.columns = 2
screen.EXPOSURE = EXPOSURE_MODE MANUAL_EXPOSURE \
                  <empty> <empty> \
                  EXPOSURE_SPEED_UP EXPOSURE_SPEED_DOWN \
                  EXPOSURE_MIN EXPOSURE_MAX \
                  EXPOSURE_LOW_PERCENT EXPOSURE_HIGH_PERCENT

screen.COLOR.columns = 2
screen.COLOR = TONEMAP <empty> \
