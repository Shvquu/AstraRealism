              FILM_GRAIN GRAIN_STRENGTH \
              LENS_FLARE LENS_FLARE_STRENGTH \
              LENS_DIRT LENS_DIRT_STRENGTH

screen.DEBUG.columns = 1
screen.DEBUG = DEBUG_MODE

