# ------------------------------------------------------------------------------
# Quality presets
#
# Each profile inherits from the one below it and overrides only what differs,
# so a change to a shared default propagates upward automatically.
# ------------------------------------------------------------------------------

profile.POTATO = shadowMapResolution:512 shadowDistance:64.0 \
                 SHADOW_FILTER:0 SHADOW_SAMPLES:4 SHADOW_BLOCKER_SAMPLES:4 \
                 !COLORED_SHADOWS !CONTACT_SHADOWS \
                 AO_MODE:0 AO_SAMPLES:4 \
                 !GI_ENABLED !GI_DENOISER GI_SAMPLES:2 GI_STEPS:4 \
                 GI_RESOLUTION_DIVISOR:4 GI_DENOISER_PASSES:1 \
                 !SSR_ENABLED !SSR_ROUGH_REFLECTIONS !SSR_TEMPORAL \
                 SSR_STEPS:8 SSR_REFINE_STEPS:0 SSR_ROUGH_SAMPLES:1 \
                 !POM_ENABLED !POM_SHADOW POM_STEPS:8 \
                 !SUBSURFACE_SCATTERING !SNOW_MATERIAL \
                 !WETNESS_ENABLED !PUDDLES !RAIN_RIPPLES \
                 !WATER_REFRACTION !WATER_CAUSTICS !WATER_FOAM \
                 WATER_WAVE_OCTAVES:2 WATER_CAUSTICS_SAMPLES:1 \
                 ATMOSPHERE_STEPS:8 !ATMOSPHERE_MULTISCATTER \
                 !VOLUMETRIC_LIGHT VL_STEPS:4 VL_RESOLUTION_DIVISOR:4 \
                 !HEIGHT_FOG \
                 CLOUDS_MODE:1 !CLOUD_SHADOWS CLOUD_STEPS:8 \
                 CLOUD_LIGHT_STEPS:2 CLOUD_RESOLUTION_DIVISOR:4 \
                 AA_MODE:1 !BLOOM_ENABLED BLOOM_MIPS:3 \
                 EXPOSURE_MODE:0 !VIGNETTE \
                 !DOF_ENABLED MOTION_BLUR:0 \
                 !CHROMATIC_ABERRATION !FILM_GRAIN !LENS_FLARE !LENS_DIRT

